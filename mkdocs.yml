site_name: Study Notes
theme:
  name: material
  language: ja
  features:
    - navigation.tabs
    - navigation.top
    - search.suggest

markdown_extensions:
  - attr_list
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
nav:
  - Home: index.md
  - Dev:
    - 音声メモ → タスク管理 PWA: dev/voice-memo-pwa.md
