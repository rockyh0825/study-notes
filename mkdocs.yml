site_name: Study Notes
theme:
  name: material
  language: ja
  features:
    - navigation.tabs
    - navigation.top
    - search.suggest

markdown_extensions:
  - attr_list
  - md_in_html
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
nav:
  - Home: index.md
  - Article:
    - 音声メモ → タスク管理 PWA: article/voice-memo-pwa.md
    - GitHub Actions 自動デプロイ: article/github-actions-self-hosted-deploy.md
  - CI/CD:
    - GitHub Actions と CI/CD の基礎: cicd/github-actions-basics.md
